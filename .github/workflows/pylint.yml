name: Pylint

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: pylint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install dependencies
      run: |
        pip install pylint pytest -r requirements.txt
    - name: Analysing the code with pylint
      run: |
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install test dependencies
      run: python -m pip install pytest -r requirements.txt
    - name: Run pytest without the GUI, external and slow tests
      run: |
        python -m pytest --ignore=tests/test_gui.py \
          -m "not external and not slow" -rs
  gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install test dependencies
      run: python -m pip install pytest -r requirements.txt
    - name: Run the GUI tests with a virtual display
      run: timeout --kill-after=30s 300s xvfb-run -a python -u -m pytest -vv -o faulthandler_timeout=60 tests/test_gui.py
