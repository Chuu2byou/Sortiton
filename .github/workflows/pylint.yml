name: Pylint

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    - name: Analysing the code with pylint
      run: |
        # Two calls on purpose - in one, astroid resolves "sortiton" to the
        # entry script and every "from . import …" in the package looks broken.
        pylint sortiton sortiton_gui.py tests tools
        pylint sortiton.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    # ffmpeg for the CLI test (without ffprobe it exits with 2), python3-tk and
    # xvfb for the GUI part.
    - name: Install system packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg python3-tk xvfb
    - name: Run the smoke test with a virtual display
      run: |
        xvfb-run -a python3 tests/smoke.py
