name: Pylint

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    - name: Analysing the code with pylint
      run: |
        # Two calls on purpose - in one, astroid resolves "sortiton" to the
        # entry script and every "from . import …" in the package looks broken.
        pylint sortiton sortiton_gui.py tests tools
        pylint sortiton.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    # ffmpeg for the CLI test (without ffprobe it exits with 2), python3-tk and
    # xvfb for the GUI part.
    - name: Install system packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg python3-tk xvfb
    # The export tests compare against the mutagen path; requirements.txt pins it.
    - name: Install runtime dependencies (mutagen)
      run: python -m pip install -r requirements.txt
    - name: Install test dependencies
      run: python -m pip install -r requirements-dev.txt
    # Transition period: the smoke wrapper and the pytest suite run side by
    # side. Both need the virtual display for the GUI checks.
    - name: Run the smoke wrapper with a virtual display
      run: |
        xvfb-run -a python3 tests/smoke.py
    - name: Run pytest with a virtual display
      run: |
        xvfb-run -a python3 -m pytest
