name: Pylint

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: pylint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pylint plus every module the analysed code imports: without pytest
        # and mutagen each file in tests/ and tools/ reports E0401
        # (import-error) and pylint exits with 2. requirements-dev.txt is not
        # used on purpose - it also pulls in pyinstaller and the security
        # tools, which the analysis does not need.
        pip install pylint pytest -r requirements.txt
    - name: Analysing the code with pylint
      run: |
        # Two calls on purpose - in one, astroid resolves "sortiton" to the
        # entry script and every "from . import …" in the package looks broken.
        pylint sortiton sortiton_gui.py tests tools
        pylint sortiton.py
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install system packages
      run: |
        # The runner image carries a packages.microsoft.com repository that
        # answers "403 Forbidden" every now and then. "apt-get update" then
        # aborts with exit code 100 and "no longer signed" - and the job dies
        # before anything is installed. Nothing here needs that repository, so
        # drop it first; ffmpeg comes from Ubuntu.
        grep -rls 'packages.microsoft.com' /etc/apt/sources.list.d/ \
          | sudo xargs -r rm -f
        timeout 180s sudo apt-get update -o Acquire::Retries=3
        timeout 180s sudo apt-get install -y ffmpeg
    - name: Install test dependencies
      run: python -m pip install pytest -r requirements.txt
    - name: Run pytest without the GUI tests
      run: python -m pytest --ignore=tests/test_gui.py
  gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install test dependencies
      run: python -m pip install pytest -r requirements.txt
    - name: Run the GUI tests with a virtual display
      run: timeout --kill-after=30s 300s xvfb-run -a python -u -m pytest -vv tests/test_gui.py
